<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NETRA Robot Monitoring System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header class="topbar">

        <!-- Brand Logo -->
        <div class="brand">

            <div class="brand-logo">N</div>

            <div>
                <h1>NETRA</h1>
                <p>ROBOT MISSION CONTROL</p>
            </div>

        </div>

        <!-- Navigation -->
        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#fleet">Fleet</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#alerts">Alerts</a>
        </nav>

        <!-- Right Side Header -->
        <div class="header-right">

            <span class="online-dot"></span>

            <span class="status-text">SYSTEM ONLINE</span>

            <strong id="clock">--:--:--</strong>

            <button id="dispatch-open" type="button">
                + Dispatch Mission
            </button>

        </div>

    </header>
<main class="page">
<section class="kpi-grid">
    <article class="kpi-grid">
        <span> ROVERS ONLINE</span>
        <h2 id="online-count">6 / 6</h2>
        <p>Active rover units</p>
    </article>
    <!-- three more cards , same shape-->

</section>

</main>
    <!-- Main Dashboard -->
    <main id="dashboard">

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
